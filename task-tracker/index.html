<title>Chronologe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
  :root{
    --bg: #eef1ef;
    --surface: #ffffff;
    --surface-2: #e2e8e5;
    --border: #cdd6d1;
    --ink: #16211d;
    --ink-muted: #55655d;
    --ink-faint: #7c8b83;
    --accent: #1f6f66;
    --accent-ink: #ffffff;
    --accent-soft: #dcece8;
    --good: #2f8f5b;
    --good-soft: #e2f2e8;
    --warn: #b5791f;
    --warn-soft: #f5ead4;
    --bad: #c0392b;
    --bad-soft: #f7e2df;
    --shadow: 0 1px 2px rgba(22,33,29,0.06), 0 8px 24px -12px rgba(22,33,29,0.18);
    --radius: 10px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #101512;
      --surface: #1a211d;
      --surface-2: #212a25;
      --border: #313d36;
      --ink: #edf2ef;
      --ink-muted: #9db0a5;
      --ink-faint: #718077;
      --accent: #55b3a4;
      --accent-ink: #0b1613;
      --accent-soft: #1e2f2b;
      --good: #52b57e;
      --good-soft: #1c2e23;
      --warn: #d9a24e;
      --warn-soft: #332818;
      --bad: #e0685a;
      --bad-soft: #3a211e;
      --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 24px -12px rgba(0,0,0,0.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg: #101512;
    --surface: #1a211d;
    --surface-2: #212a25;
    --border: #313d36;
    --ink: #edf2ef;
    --ink-muted: #9db0a5;
    --ink-faint: #718077;
    --accent: #55b3a4;
    --accent-ink: #0b1613;
    --accent-soft: #1e2f2b;
    --good: #52b57e;
    --good-soft: #1c2e23;
    --warn: #d9a24e;
    --warn-soft: #332818;
    --bad: #e0685a;
    --bad-soft: #3a211e;
    --shadow: 0 1px 2px rgba(0,0,0,0.35), 0 8px 24px -12px rgba(0,0,0,0.5);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Public Sans', system-ui, sans-serif;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  .wrap{
    max-width:920px;
    margin:0 auto;
    padding:28px 20px 80px;
  }

  /* ---------- header ---------- */
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:16px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .brand{display:flex; flex-direction:column; gap:2px;}
  .brand-mark{
    display:flex; align-items:center; gap:10px;
  }
  .brand-mark svg{flex:0 0 auto;}
  h1{
    font-family:'Zilla Slab', Georgia, serif;
    font-weight:700;
    font-size:1.65rem;
    margin:0;
    letter-spacing:0.2px;
    text-wrap:balance;
  }
  .tagline{
    font-size:0.83rem;
    color:var(--ink-muted);
    margin:0;
  }
  .clock{
    font-family:'IBM Plex Mono', monospace;
    font-variant-numeric:tabular-nums;
    font-size:1.55rem;
    font-weight:500;
    color:var(--accent);
    text-align:right;
    line-height:1.1;
  }
  .clock .date{
    display:block;
    font-family:'Public Sans', sans-serif;
    font-size:0.75rem;
    color:var(--ink-faint);
    text-transform:capitalize;
    margin-top:2px;
  }

  /* ---------- stat strip ---------- */
  .stats{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:1px;
    background:var(--border);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
    margin-bottom:24px;
    box-shadow:var(--shadow);
  }
  .stat{
    background:var(--surface);
    padding:14px 16px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .stat .label{
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--ink-faint);
    font-weight:600;
  }
  .stat .value{
    font-family:'IBM Plex Mono', monospace;
    font-variant-numeric:tabular-nums;
    font-size:1.3rem;
    font-weight:500;
  }
  .stat .value.pos{color:var(--bad);}
  .stat .value.neg{color:var(--good);}

  /* ---------- add-task panel ---------- */
  .panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    margin-bottom:22px;
  }
  .panel-head{
    padding:14px 18px;
    font-family:'Zilla Slab', serif;
    font-weight:600;
    font-size:1.02rem;
    border-bottom:1px solid var(--border);
  }
  form#add-form{
    padding:16px 18px 18px;
    display:grid;
    grid-template-columns:2.2fr 1fr 1fr 1fr auto;
    gap:12px;
    align-items:end;
  }
  .field{display:flex; flex-direction:column; gap:5px; min-width:0;}
  .field label{
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--ink-faint);
    font-weight:600;
  }
  input, select{
    font-family:'Public Sans', sans-serif;
    font-size:0.92rem;
    color:var(--ink);
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:7px;
    padding:8px 10px;
    width:100%;
  }
  input:focus, select:focus, button:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  input[type="number"]{font-family:'IBM Plex Mono', monospace;}

  button{
    font-family:'Public Sans', sans-serif;
    cursor:pointer;
    border:none;
    border-radius:7px;
    font-weight:600;
  }
  .btn-primary{
    background:var(--accent);
    color:var(--accent-ink);
    padding:9px 18px;
    font-size:0.9rem;
    white-space:nowrap;
  }
  .btn-primary:hover{filter:brightness(1.06);}

  /* ---------- filter tabs ---------- */
  .tabs{
    display:flex;
    gap:6px;
    margin-bottom:12px;
  }
  .tabs button{
    background:transparent;
    color:var(--ink-muted);
    padding:6px 13px;
    font-size:0.83rem;
    border-radius:20px;
    border:1px solid transparent;
  }
  .tabs button.active{
    background:var(--accent-soft);
    color:var(--accent);
    border-color:var(--accent);
  }
  .tabs button:hover:not(.active){background:var(--surface-2);}

  /* ---------- task list ---------- */
  .list{display:flex; flex-direction:column; gap:8px;}
  .empty{
    padding:40px 20px;
    text-align:center;
    color:var(--ink-faint);
    background:var(--surface);
    border:1px dashed var(--border);
    border-radius:var(--radius);
    font-size:0.9rem;
  }

  .task{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:12px 16px;
    display:grid;
    grid-template-columns:auto 1.7fr 1fr 1fr 1fr auto;
    gap:14px;
    align-items:center;
  }
  .task.is-running{border-color:var(--accent);}

  .status-dot{
    width:10px; height:10px; border-radius:50%;
    background:var(--ink-faint);
    flex:0 0 auto;
  }
  .task.is-running .status-dot{background:var(--warn); box-shadow:0 0 0 3px var(--warn-soft);}
  .task.is-done .status-dot{background:var(--good);}

  .t-name{min-width:0;}
  .t-name .name{font-weight:600; font-size:0.96rem; word-break:break-word;}
  .t-name .chip{
    display:inline-block;
    margin-top:4px;
    font-size:0.68rem;
    text-transform:uppercase;
    letter-spacing:0.04em;
    font-weight:700;
    padding:2px 7px;
    border-radius:20px;
    background:var(--surface-2);
    color:var(--ink-faint);
  }
  .task.is-running .t-name .chip{background:var(--warn-soft); color:var(--warn);}
  .task.is-done .t-name .chip{background:var(--good-soft); color:var(--good);}

  .t-col{display:flex; flex-direction:column; gap:2px; min-width:0;}
  .t-col .label{font-size:0.68rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--ink-faint); font-weight:600;}
  .t-col .val{font-family:'IBM Plex Mono', monospace; font-variant-numeric:tabular-nums; font-size:0.88rem;}
  .t-col .val.muted{color:var(--ink-faint);}
  .t-col .val.good{color:var(--good);}
  .t-col .val.bad{color:var(--bad);}

  .t-actions{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
  .icon-btn{
    background:var(--surface-2);
    color:var(--ink);
    border:1px solid var(--border);
    padding:6px 10px;
    font-size:0.8rem;
    border-radius:7px;
    display:inline-flex;
    align-items:center;
    gap:5px;
  }
  .icon-btn:hover{background:var(--accent-soft); color:var(--accent); border-color:var(--accent);}
  .icon-btn.danger:hover{background:var(--bad-soft); color:var(--bad); border-color:var(--bad);}
  .icon-btn.start{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
  .icon-btn.start:hover{filter:brightness(1.08);}

  footer{
    margin-top:26px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
    font-size:0.8rem;
    color:var(--ink-faint);
  }
  footer .links{display:flex; gap:14px;}
  footer button.link{
    background:none;
    color:var(--ink-muted);
    font-size:0.8rem;
    text-decoration:underline;
    padding:0;
    font-weight:500;
  }
  footer button.link:hover{color:var(--accent);}

  /* ---------- modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0;
    background:rgba(10,15,13,0.45);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }
  .modal-backdrop.open{display:flex;}
  .modal{
    background:var(--surface);
    border-radius:12px;
    box-shadow:var(--shadow);
    width:100%;
    max-width:480px;
    max-height:90vh;
    overflow:auto;
    border:1px solid var(--border);
  }
  .modal-head{
    padding:16px 20px;
    border-bottom:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .modal-head h2{
    font-family:'Zilla Slab', serif;
    font-size:1.1rem;
    margin:0;
    font-weight:600;
  }
  .modal-head button{background:none; color:var(--ink-faint); font-size:1.1rem; padding:2px 6px;}
  .modal-body{padding:18px 20px; display:flex; flex-direction:column; gap:14px;}
  .modal-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .modal-foot{
    padding:14px 20px 18px;
    display:flex;
    justify-content:flex-end;
    gap:10px;
  }
  .btn-ghost{background:var(--surface-2); color:var(--ink); padding:9px 16px; font-size:0.88rem;}
  .btn-ghost:hover{background:var(--border);}

  @media (max-width: 720px){
    form#add-form{grid-template-columns:1fr 1fr; }
    form#add-form .field.name{grid-column:1 / -1;}
    form#add-form button{grid-column:1 / -1;}
    .stats{grid-template-columns:repeat(2, 1fr);}
    .task{
      grid-template-columns:1fr;
      row-gap:8px;
    }
    .task .status-dot{display:none;}
    .t-actions{justify-content:flex-start;}
  }
</style>

<div class="wrap">

  <header>
    <div class="brand">
      <div class="brand-mark">
        <svg width="30" height="30" viewBox="0 0 30 30" fill="none" aria-hidden="true">
          <circle cx="15" cy="16" r="11" stroke="var(--accent)" stroke-width="2.2"/>
          <path d="M15 9V16L20 19" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 3H18" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M15 3V5.5" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <h1>Chronologe</h1>
      </div>
      <p class="tagline">Prévu contre réalisé — pour vos journées de travail.</p>
    </div>
    <div class="clock">
      <span id="clock-time">--:--:--</span>
      <span class="date" id="clock-date">—</span>
    </div>
  </header>

  <div class="stats" id="stats">
    <div class="stat">
      <span class="label">Tâches aujourd'hui</span>
      <span class="value" id="stat-count">0</span>
    </div>
    <div class="stat">
      <span class="label">Durée prévue</span>
      <span class="value" id="stat-planned">0 h 00</span>
    </div>
    <div class="stat">
      <span class="label">Durée réelle</span>
      <span class="value" id="stat-actual">0 h 00</span>
    </div>
    <div class="stat">
      <span class="label">Écart</span>
      <span class="value" id="stat-variance">0 h 00</span>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">Nouvelle tâche</div>
    <form id="add-form">
      <div class="field name">
        <label for="f-name">Tâche</label>
        <input type="text" id="f-name" placeholder="Ex. Rédiger le rapport" required>
      </div>
      <div class="field">
        <label for="f-date">Date prévue</label>
        <input type="date" id="f-date" required>
      </div>
      <div class="field">
        <label for="f-hours">Durée prévue (h)</label>
        <input type="number" id="f-hours" min="0" max="23" step="1" value="0">
      </div>
      <div class="field">
        <label for="f-min">Durée prévue (min)</label>
        <input type="number" id="f-min" min="0" max="59" step="5" value="30">
      </div>
      <button type="submit" class="btn-primary">Ajouter</button>
    </form>
  </div>

  <div class="tabs" id="tabs">
    <button data-filter="today" class="active">Aujourd'hui</button>
    <button data-filter="open">En cours / à faire</button>
    <button data-filter="all">Toutes</button>
  </div>

  <div class="list" id="list"></div>

  <footer>
    <span id="footer-note">Les données restent dans ce navigateur.</span>
    <div class="links">
      <button class="link" id="export-btn" type="button">Exporter en CSV</button>
      <button class="link" id="copy-btn" type="button">Copier en CSV</button>
      <button class="link" id="clear-done-btn" type="button">Effacer les tâches terminées</button>
    </div>
  </footer>
</div>

<!-- edit modal -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <div class="modal-head">
      <h2>Modifier la tâche</h2>
      <button type="button" id="modal-close" aria-label="Fermer">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label for="m-name">Tâche</label>
        <input type="text" id="m-name">
      </div>
      <div class="modal-row">
        <div class="field">
          <label for="m-hours">Durée prévue (h)</label>
          <input type="number" id="m-hours" min="0" max="23">
        </div>
        <div class="field">
          <label for="m-min">Durée prévue (min)</label>
          <input type="number" id="m-min" min="0" max="59">
        </div>
      </div>
      <div class="modal-row">
        <div class="field">
          <label for="m-start-date">Date de début</label>
          <input type="date" id="m-start-date">
        </div>
        <div class="field">
          <label for="m-start-time">Heure de début</label>
          <input type="time" id="m-start-time">
        </div>
      </div>
      <div class="modal-row">
        <div class="field">
          <label for="m-end-date">Date de fin</label>
          <input type="date" id="m-end-date">
        </div>
        <div class="field">
          <label for="m-end-time">Heure de fin</label>
          <input type="time" id="m-end-time">
        </div>
      </div>
      <div class="field">
        <label for="m-status">Statut</label>
        <select id="m-status">
          <option value="todo">À faire</option>
          <option value="running">En cours</option>
          <option value="done">Terminée</option>
        </select>
      </div>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn-ghost" id="modal-cancel">Annuler</button>
      <button type="button" class="btn-primary" id="modal-save">Enregistrer</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "chronologe.tasks.v1";
  var tasks = [];
  var currentFilter = "today";
  var editingId = null;

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function todayISO(){
    var d = new Date();
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
  }
  function pad(n){ return n < 10 ? "0"+n : ""+n; }
  function nowTimeHM(){
    var d = new Date();
    return pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  function load(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      tasks = raw ? JSON.parse(raw) : [];
    }catch(e){ tasks = []; }
  }
  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }catch(e){}
  }

  function minutesToLabel(mins){
    if (mins == null || isNaN(mins)) return "—";
    var sign = mins < 0 ? "-" : "";
    mins = Math.abs(Math.round(mins));
    var h = Math.floor(mins/60), m = mins%60;
    return sign + (h > 0 ? h + " h " + pad(m) : m + " min");
  }

  function combine(dateStr, timeStr){
    if (!dateStr || !timeStr) return null;
    var dt = new Date(dateStr + "T" + timeStr + ":00");
    return isNaN(dt.getTime()) ? null : dt;
  }

  function actualMinutes(task, upToNow){
    var start = combine(task.startDate, task.startTime);
    if (!start) return null;
    var end;
    if (task.status === "running") {
      if (!upToNow) return null;
      end = new Date();
    } else {
      end = combine(task.endDate, task.endTime);
    }
    if (!end) return null;
    return (end.getTime() - start.getTime()) / 60000;
  }

  function statusLabel(s){
    return s === "running" ? "En cours" : s === "done" ? "Terminée" : "À faire";
  }

  /* ---------- rendering ---------- */

  function render(){
    renderStats();
    renderList();
  }

  function renderStats(){
    var today = todayISO();
    var todays = tasks.filter(function(t){ return t.plannedDate === today || t.startDate === today; });
    var planned = 0, actual = 0, haveActual = false;
    todays.forEach(function(t){
      planned += (t.plannedMinutes || 0);
      var a = actualMinutes(t, true);
      if (a != null){ actual += a; haveActual = true; }
    });
    document.getElementById("stat-count").textContent = todays.length;
    document.getElementById("stat-planned").textContent = minutesToLabel(planned);
    document.getElementById("stat-actual").textContent = haveActual ? minutesToLabel(actual) : "—";

    var varEl = document.getElementById("stat-variance");
    if (haveActual){
      var diff = actual - planned;
      varEl.textContent = (diff >= 0 ? "+" : "") + minutesToLabel(diff);
      varEl.className = "value " + (diff > 0 ? "pos" : diff < 0 ? "neg" : "");
    } else {
      varEl.textContent = "—";
      varEl.className = "value";
    }
  }

  function filteredTasks(){
    var today = todayISO();
    var list = tasks.slice().sort(function(a,b){
      return (b.createdAt||0) - (a.createdAt||0);
    });
    if (currentFilter === "today"){
      return list.filter(function(t){ return t.plannedDate === today || t.startDate === today; });
    }
    if (currentFilter === "open"){
      return list.filter(function(t){ return t.status !== "done"; });
    }
    return list;
  }

  function renderList(){
    var container = document.getElementById("list");
    var list = filteredTasks();
    container.innerHTML = "";

    if (list.length === 0){
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Aucune tâche ici. Ajoutez-en une ci-dessus.";
      container.appendChild(empty);
      return;
    }

    list.forEach(function(t){
      container.appendChild(renderTask(t));
    });
  }

  function renderTask(t){
    var el = document.createElement("div");
    el.className = "task" + (t.status === "running" ? " is-running" : t.status === "done" ? " is-done" : "");
    el.dataset.id = t.id;

    var actual = actualMinutes(t, true);
    var planned = t.plannedMinutes || 0;
    var varClass = "muted";
    if (actual != null && planned > 0){
      varClass = actual <= planned ? "good" : "bad";
    }

    var startLabel = t.startDate ? (formatDateShort(t.startDate) + (t.startTime ? " · " + t.startTime : "")) : "—";
    var endLabel = t.status === "running" ? "en cours…" : (t.endDate ? (formatDateShort(t.endDate) + (t.endTime ? " · " + t.endTime : "")) : "—");

    el.innerHTML =
      '<span class="status-dot"></span>' +
      '<div class="t-name">' +
        '<div class="name"></div>' +
        '<span class="chip">' + statusLabel(t.status) + '</span>' +
      '</div>' +
      '<div class="t-col"><span class="label">Prévu</span><span class="val">' + minutesToLabel(planned) + '</span></div>' +
      '<div class="t-col"><span class="label">Début → Fin</span><span class="val muted" style="font-size:0.78rem;">' + startLabel + ' → ' + endLabel + '</span></div>' +
      '<div class="t-col"><span class="label">Réel</span><span class="val ' + varClass + '">' + (actual != null ? minutesToLabel(actual) : "—") + '</span></div>' +
      '<div class="t-actions"></div>';

    el.querySelector(".name").textContent = t.name;

    var actions = el.querySelector(".t-actions");

    if (t.status === "todo"){
      actions.appendChild(makeBtn("Démarrer", "start", function(){ startTask(t.id); }));
    }
    if (t.status === "running"){
      actions.appendChild(makeBtn("Terminer", "start", function(){ finishTask(t.id); }));
    }
    actions.appendChild(makeBtn("Modifier", "", function(){ openEdit(t.id); }));
    actions.appendChild(makeBtn("Supprimer", "danger", function(){ deleteTask(t.id); }));

    return el;
  }

  function makeBtn(label, cls, onClick){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "icon-btn" + (cls ? " " + cls : "");
    b.textContent = label;
    b.addEventListener("click", onClick);
    return b;
  }

  function formatDateShort(iso){
    if (!iso) return "—";
    var parts = iso.split("-");
    if (parts.length !== 3) return iso;
    return parts[2] + "/" + parts[1];
  }

  /* ---------- actions ---------- */

  function addTask(name, plannedDate, plannedMinutes){
    tasks.push({
      id: uid(),
      name: name,
      plannedDate: plannedDate,
      plannedMinutes: plannedMinutes,
      startDate: null, startTime: null,
      endDate: null, endTime: null,
      status: "todo",
      createdAt: Date.now()
    });
    save(); render();
  }

  function startTask(id){
    var t = tasks.find(function(x){ return x.id === id; });
    if (!t) return;
    t.status = "running";
    t.startDate = todayISO();
    t.startTime = nowTimeHM();
    t.endDate = null; t.endTime = null;
    save(); render();
  }

  function finishTask(id){
    var t = tasks.find(function(x){ return x.id === id; });
    if (!t) return;
    t.status = "done";
    t.endDate = todayISO();
    t.endTime = nowTimeHM();
    save(); render();
  }

  function deleteTask(id){
    var t = tasks.find(function(x){ return x.id === id; });
    if (!t) return;
    if (!confirm('Supprimer la tâche « ' + t.name + ' » ?')) return;
    tasks = tasks.filter(function(x){ return x.id !== id; });
    save(); render();
  }

  function clearDone(){
    var n = tasks.filter(function(t){ return t.status === "done"; }).length;
    if (n === 0) return;
    if (!confirm("Effacer " + n + " tâche(s) terminée(s) ?")) return;
    tasks = tasks.filter(function(t){ return t.status !== "done"; });
    save(); render();
  }

  /* ---------- edit modal ---------- */

  function openEdit(id){
    var t = tasks.find(function(x){ return x.id === id; });
    if (!t) return;
    editingId = id;
    document.getElementById("m-name").value = t.name;
    document.getElementById("m-hours").value = Math.floor((t.plannedMinutes||0)/60);
    document.getElementById("m-min").value = (t.plannedMinutes||0)%60;
    document.getElementById("m-start-date").value = t.startDate || "";
    document.getElementById("m-start-time").value = t.startTime || "";
    document.getElementById("m-end-date").value = t.endDate || "";
    document.getElementById("m-end-time").value = t.endTime || "";
    document.getElementById("m-status").value = t.status;
    document.getElementById("modal-backdrop").classList.add("open");
  }

  function closeEdit(){
    editingId = null;
    document.getElementById("modal-backdrop").classList.remove("open");
  }

  function saveEdit(){
    var t = tasks.find(function(x){ return x.id === editingId; });
    if (!t) return;
    t.name = document.getElementById("m-name").value.trim() || t.name;
    var h = parseInt(document.getElementById("m-hours").value, 10) || 0;
    var m = parseInt(document.getElementById("m-min").value, 10) || 0;
    t.plannedMinutes = h*60 + m;
    t.startDate = document.getElementById("m-start-date").value || null;
    t.startTime = document.getElementById("m-start-time").value || null;
    t.endDate = document.getElementById("m-end-date").value || null;
    t.endTime = document.getElementById("m-end-time").value || null;
    t.status = document.getElementById("m-status").value;
    if (t.startDate) t.plannedDate = t.plannedDate || t.startDate;
    save(); closeEdit(); render();
  }

  /* ---------- export ---------- */

  var downloadsApi = null;
  if (window.claude && typeof window.claude.use === "function"){
    window.claude.use("downloads").then(function(ns){ downloadsApi = ns; }).catch(function(){});
  }

  function buildCSV(){
    var rows = [["Tâche","Statut","Date prévue","Durée prévue (min)","Date début","Heure début","Date fin","Heure fin","Durée réelle (min)"]];
    tasks.forEach(function(t){
      var a = actualMinutes(t, true);
      rows.push([
        t.name, statusLabel(t.status), t.plannedDate || "", t.plannedMinutes || 0,
        t.startDate || "", t.startTime || "", t.endDate || "", t.endTime || "",
        a != null ? Math.round(a) : ""
      ]);
    });
    return rows.map(function(r){
      return r.map(function(cell){
        var s = String(cell).replace(/"/g,'""');
        return /[",\n;]/.test(s) ? '"' + s + '"' : s;
      }).join(";");
    }).join("\n");
  }

  function exportCSV(){
    var csv = "﻿" + buildCSV();
    var filename = "chronologe-" + todayISO() + ".csv";

    if (downloadsApi){
      downloadsApi.save({ filename: filename, data: csv }).catch(function(err){
        if (err && err.code === "declined") return;
        alert("Export impossible ici : " + (err && err.message ? err.message : "indisponible") + ". Utilisez le bouton « Copier en CSV » à la place.");
      });
      return;
    }
    // Environnement hors artefact (fichier local, hébergement statique) : téléchargement classique.
    var blob = new Blob([csv], {type: "text/csv;charset=utf-8;"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  function copyCSV(){
    var csv = buildCSV();
    var done = function(){ flashFooterNote("CSV copié dans le presse-papiers."); };
    var fail = function(){ flashFooterNote("Impossible de copier automatiquement."); };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(csv).then(done).catch(fail);
    } else {
      fail();
    }
  }

  var footerNoteTimer = null;
  function flashFooterNote(msg){
    var el = document.getElementById("footer-note");
    if (footerNoteTimer) clearTimeout(footerNoteTimer);
    var original = "Les données restent dans ce navigateur.";
    el.textContent = msg;
    footerNoteTimer = setTimeout(function(){ el.textContent = original; }, 3500);
  }

  /* ---------- clock ---------- */

  var WEEKDAYS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
  var MONTHS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

  function tickClock(){
    var d = new Date();
    document.getElementById("clock-time").textContent = pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
    document.getElementById("clock-date").textContent = WEEKDAYS[d.getDay()] + " " + d.getDate() + " " + MONTHS[d.getMonth()];
  }

  /* ---------- wiring ---------- */

  document.getElementById("add-form").addEventListener("submit", function(ev){
    ev.preventDefault();
    var name = document.getElementById("f-name").value.trim();
    var date = document.getElementById("f-date").value || todayISO();
    var h = parseInt(document.getElementById("f-hours").value, 10) || 0;
    var m = parseInt(document.getElementById("f-min").value, 10) || 0;
    if (!name) return;
    addTask(name, date, h*60 + m);
    document.getElementById("f-name").value = "";
    document.getElementById("f-name").focus();
  });

  document.getElementById("tabs").addEventListener("click", function(ev){
    var btn = ev.target.closest("button[data-filter]");
    if (!btn) return;
    currentFilter = btn.dataset.filter;
    Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function(b){
      b.classList.toggle("active", b === btn);
    });
    renderList();
  });

  document.getElementById("export-btn").addEventListener("click", exportCSV);
  document.getElementById("copy-btn").addEventListener("click", copyCSV);
  document.getElementById("clear-done-btn").addEventListener("click", clearDone);
  document.getElementById("modal-close").addEventListener("click", closeEdit);
  document.getElementById("modal-cancel").addEventListener("click", closeEdit);
  document.getElementById("modal-save").addEventListener("click", saveEdit);
  document.getElementById("modal-backdrop").addEventListener("click", function(ev){
    if (ev.target === ev.currentTarget) closeEdit();
  });

  document.getElementById("f-date").value = todayISO();

  load();
  render();
  tickClock();
  setInterval(function(){
    tickClock();
    if (tasks.some(function(t){ return t.status === "running"; })){
      render();
    }
  }, 1000);

})();
</script>
